name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -trimpath
  # Do not pin CGO_ENABLED here: the race detector requires cgo, and the
  # cross-build job needs it disabled. Each step sets what it needs.
  # CGO_ENABLED="0"

jobs:
  # Fast feedback: formatting, vet and unit tests on one runner.
  static:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: verify dependencies
        run: go mod verify

  # Unit, daemon, CLI and IPC tests on every supported OS.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: unit tests
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/...
      - name: security acceptance tests
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race ./tests/security/...

  # Process-level integration tests: build the real binaries and drive them.
  integration:
    name: integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: integration tests
        shell: bash
        run: go test -v -timeout 15m ./tests/integration/...

  # Prove the whole tree compiles for six targets, including the Windows and
  # macOS-specific files that are never exercised on a Linux runner.
  cross-build:
    name: cross build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build all targets
        env:
          CGO_ENABLED: "0"
        run: make cross

  # Release artifacts are only produced from a tagged build on main.
  release-artifacts:
    name: release archives
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [static, test, integration, cross-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe needs tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build archives
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: voxen-release
          path: dist/*.tar.gz
          retention-days: 30
